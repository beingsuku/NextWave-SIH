      }
    }

      }

      }

      100% {

    .animate-scan {

    // ----------------------------------------------------
    // CANVAS BACKGROUND (India Border Network)
    // ----------------------------------------------------
    function IndiaCanvasBackground({ isCinematic, isTransitioning }) {
      const canvasRef = useRef(null);

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        let animId;
        let scanY = 0;
        let scanDirection = 1;

        const resize = () => {
          canvas.width = window.innerWidth;
          canvas.height = window.innerHeight;
        };
        resize();
        window.addEventListener('resize', resize);

        const nodes = [
          { name: 'Attari-Wagah', x: 0.32, y: 0.22 },
          { name: 'Raxaul', x: 0.58, y: 0.32 },
          { name: 'Banbasa', x: 0.44, y: 0.25 },
          { name: 'Petrapole', x: 0.70, y: 0.46 },
          { name: 'Moreh', x: 0.84, y: 0.38 }
        ];

        const indiaOutline = [
          { x: 0.30, y: 0.15 }, { x: 0.38, y: 0.10 }, { x: 0.45, y: 0.12 },
          { x: 0.52, y: 0.22 }, { x: 0.68, y: 0.24 }, { x: 0.82, y: 0.22 },
          { x: 0.88, y: 0.34 }, { x: 0.78, y: 0.46 }, { x: 0.65, y: 0.50 },
          { x: 0.52, y: 0.65 }, { x: 0.48, y: 0.82 }, { x: 0.42, y: 0.88 },
          { x: 0.38, y: 0.75 }, { x: 0.28, y: 0.55 }, { x: 0.22, y: 0.38 },
          { x: 0.26, y: 0.22 }
        ];

        const draw = () => {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          const w = canvas.width;
          const h = canvas.height;

          // Grid
          ctx.strokeStyle = isCinematic ? 'rgba(10, 49, 97, 0.08)' : 'rgba(10, 49, 97, 0.05)';
          ctx.lineWidth = 1;
          for (let x = 0; x < w; x += 80) {
            ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke();
          }
          for (let y = 0; y < h; y += 80) {
            ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke();
          }

          // India Vector Silhouette
          ctx.beginPath();
          indiaOutline.forEach((pt, idx) => {
            const px = pt.x * w;
            const py = pt.y * h;
            if (idx === 0) ctx.moveTo(px, py);
            else ctx.lineTo(px, py);
          });
          ctx.closePath();
          ctx.fillStyle = isCinematic ? 'rgba(10, 49, 97, 0.05)' : 'rgba(10, 49, 97, 0.03)';
          ctx.fill();
          ctx.strokeStyle = isCinematic ? 'rgba(200, 151, 58, 0.25)' : 'rgba(200, 151, 58, 0.1)';
          ctx.lineWidth = 1.5;
          ctx.stroke();

          // Scan beam
          scanY += 1.2 * scanDirection;
          if (scanY > h || scanY < 0) scanDirection *= -1;

          const scanGrad = ctx.createLinearGradient(0, scanY - 20, 0, scanY + 20);
          scanGrad.addColorStop(0, 'rgba(10, 49, 97, 0)');
          scanGrad.addColorStop(0.5, isCinematic ? 'rgba(10, 49, 97, 0.08)' : 'rgba(10, 49, 97, 0.04)');
          scanGrad.addColorStop(1, 'rgba(10, 49, 97, 0)');
          ctx.fillStyle = scanGrad;
          ctx.fillRect(0, scanY - 20, w, 40);

          // Connections
          nodes.forEach((n1, i) => {
            nodes.forEach((n2, j) => {
              if (i < j) {
                ctx.beginPath();
                ctx.moveTo(n1.x * w, n1.y * h);
                ctx.lineTo(n2.x * w, n2.y * h);
                ctx.strokeStyle = isCinematic ? 'rgba(200, 151, 58, 0.2)' : 'rgba(10, 49, 97, 0.06)';
                ctx.lineWidth = 1;
                ctx.setLineDash([4, 6]);
                ctx.stroke();
                ctx.setLineDash([]);
              }
            });
          });

          // Nodes
          const pulse = (Math.sin(Date.now() * 0.003) + 1) * 0.5;
          nodes.forEach((n) => {
            const nx = n.x * w;
            const ny = n.y * h;

            ctx.beginPath();
            ctx.arc(nx, ny, 5 + pulse * 5, 0, Math.PI * 2);
            ctx.fillStyle = isCinematic ? 'rgba(10, 49, 97, 0.12)' : 'rgba(10, 49, 97, 0.08)';
            ctx.fill();

            ctx.beginPath();
            ctx.arc(nx, ny, 3.5, 0, Math.PI * 2);
            ctx.fillStyle = '#0a3161';
            ctx.fill();
          });

          animId = requestAnimationFrame(draw);
        };

        draw();
        return () => {
          window.removeEventListener('resize', resize);
          cancelAnimationFrame(animId);
        };
      }, [isCinematic, isTransitioning]);

      return (
        <canvas
          ref={canvasRef}
          className={`fixed inset-0 pointer-events-none z-0 transition-opacity duration-700 ${isCinematic ? 'opacity-90' : 'opacity-60'
            }`}
        />
      );
    }

    function NewScreeningPage({ selectedDocType, setSelectedDocType, uploadedDocImage, setUploadedDocImage, uploadedFileName, setUploadedFileName, onStartPipeline, activeScenario, onScenarioChange, setScreeningResult }) {
      const fileInputRef = useRef(null);

        { id: 'passport', label: 'Passport', icon: '📖' },
        { id: 'visa', label: 'Travel Visa', icon: '📑' },
        { id: 'national_id', label: 'National ID', icon: '🪪' },
        { id: 'driving_licence', label: 'Driving Licence', icon: '💳' },
        { id: 'travel_permit', label: 'Travel Permit', icon: '📝' }
      ];

      // Handle local file selection via existing upload bar
      const handleFileUpload = (e) => {
        const file = e.target.files?.[0];

        if (!file) return;

        console.log("DOCSHIELD: File selected:", file.name);

        // Save the actual uploaded file
        window.__DOCSHIELD_UPLOADED_FILE__ = file;

        setUploadedFileName(file.name);

        // Handle image files
        if (file.type.startsWith("image/")) {
          const reader = new FileReader();

          reader.onload = (event) => {
            const dataUrl = event.target.result;

            console.log("DOCSHIELD: Image loaded successfully");

            // Save image for analysis
            window.__DOCSHIELD_UPLOADED_DATA_URL__ = dataUrl;

            // IMPORTANT: update the visible preview
            setUploadedDocImage(dataUrl);

            // Update screening result with uploaded image
            setScreeningResult(prev => ({
              ...prev,
              documentImage: dataUrl,
              documentType: selectedDocType,
              documentTypeLabel:
                docTypes.find(d => d.id === selectedDocType)?.label ||
                "Uploaded Document"
            }));
          };

          reader.onerror = () => {
            console.error("DOCSHIELD: Could not read image");
            alert("Unable to read this image. Please try another JPG or PNG.");
          };

          reader.readAsDataURL(file);

          return;
        }

        // Handle PDF
        if (file.type === "application/pdf") {
          console.log("DOCSHIELD: PDF selected");

          setUploadedDocImage(null);

          setScreeningResult(prev => ({
            ...prev,
            documentImage: null,
            documentType: selectedDocType,
            documentTypeLabel:
              docTypes.find(d => d.id === selectedDocType)?.label ||
              "Uploaded PDF"
          }));

          return;
        }

        alert("Please upload a JPG, PNG, or PDF file.");
      };
      return (
