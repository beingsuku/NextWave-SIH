// ----------------------------------------------------
// CANVAS BACKGROUND (India Border Network)
// ----------------------------------------------------
function IndiaCanvasBackground({ isCinematic, isTransitioning }) {
  const canvasRef = useRef(null);

  useEffect(() => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    let animId;
    let scanY = 0;
    let scanDirection = 1;

    const resize = () => {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    };
    resize();
    window.addEventListener('resize', resize);

    const nodes = [
      { name: 'Attari-Wagah', x: 0.32, y: 0.22 },
      { name: 'Raxaul', x: 0.58, y: 0.32 },
      { name: 'Banbasa', x: 0.44, y: 0.25 },
      { name: 'Petrapole', x: 0.70, y: 0.46 },
      { name: 'Moreh', x: 0.84, y: 0.38 }
    ];

    const indiaOutline = [
      { x: 0.30, y: 0.15 }, { x: 0.38, y: 0.10 }, { x: 0.45, y: 0.12 },
      { x: 0.52, y: 0.22 }, { x: 0.68, y: 0.24 }, { x: 0.82, y: 0.22 },
      { x: 0.88, y: 0.34 }, { x: 0.78, y: 0.46 }, { x: 0.65, y: 0.50 },
      { x: 0.52, y: 0.65 }, { x: 0.48, y: 0.82 }, { x: 0.42, y: 0.88 },
      { x: 0.38, y: 0.75 }, { x: 0.28, y: 0.55 }, { x: 0.22, y: 0.38 },
      { x: 0.26, y: 0.22 }
    ];

    const draw = () => {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const w = canvas.width;
      const h = canvas.height;

      // Grid
      ctx.strokeStyle = isCinematic ? 'rgba(10, 49, 97, 0.08)' : 'rgba(10, 49, 97, 0.05)';
      ctx.lineWidth = 1;
      for (let x = 0; x < w; x += 80) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke();
      }
      for (let y = 0; y < h; y += 80) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke();
      }

      // India Vector Silhouette
      ctx.beginPath();
      indiaOutline.forEach((pt, idx) => {
        const px = pt.x * w;
        const py = pt.y * h;
        if (idx === 0) ctx.moveTo(px, py);
        else ctx.lineTo(px, py);
      });
      ctx.closePath();
      ctx.fillStyle = isCinematic ? 'rgba(10, 49, 97, 0.05)' : 'rgba(10, 49, 97, 0.03)';
      ctx.fill();
      ctx.strokeStyle = isCinematic ? 'rgba(200, 151, 58, 0.25)' : 'rgba(200, 151, 58, 0.1)';
      ctx.lineWidth = 1.5;
      ctx.stroke();

      // Scan beam
      scanY += 1.2 * scanDirection;
      if (scanY > h || scanY < 0) scanDirection *= -1;
      
      const scanGrad = ctx.createLinearGradient(0, scanY - 20, 0, scanY + 20);
      scanGrad.addColorStop(0, 'rgba(10, 49, 97, 0)');
      scanGrad.addColorStop(0.5, isCinematic ? 'rgba(10, 49, 97, 0.08)' : 'rgba(10, 49, 97, 0.04)');
      scanGrad.addColorStop(1, 'rgba(10, 49, 97, 0)');
      ctx.fillStyle = scanGrad;
      ctx.fillRect(0, scanY - 20, w, 40);

      // Connections
      nodes.forEach((n1, i) => {
        nodes.forEach((n2, j) => {
          if (i < j) {
            ctx.beginPath();
            ctx.moveTo(n1.x * w, n1.y * h);
            ctx.lineTo(n2.x * w, n2.y * h);
            ctx.strokeStyle = isCinematic ? 'rgba(200, 151, 58, 0.2)' : 'rgba(10, 49, 97, 0.06)';
            ctx.lineWidth = 1;
            ctx.setLineDash([4, 6]);
            ctx.stroke();
            ctx.setLineDash([]);
          }
        });
      });

      // Nodes
      const pulse = (Math.sin(Date.now() * 0.003) + 1) * 0.5;
      nodes.forEach((n) => {
        const nx = n.x * w;
        const ny = n.y * h;

        ctx.beginPath();
        ctx.arc(nx, ny, 5 + pulse * 5, 0, Math.PI * 2);
        ctx.fillStyle = isCinematic ? 'rgba(10, 49, 97, 0.12)' : 'rgba(10, 49, 97, 0.08)';
        ctx.fill();

        ctx.beginPath();
        ctx.arc(nx, ny, 3.5, 0, Math.PI * 2);
        ctx.fillStyle = '#0a3161';
        ctx.fill();
      });

      animId = requestAnimationFrame(draw);
    };

    draw();
    return () => {
      window.removeEventListener('resize', resize);
      cancelAnimationFrame(animId);
    };
  }, [isCinematic, isTransitioning]);

  return (
    <canvas 
      ref={canvasRef} 
      className={`fixed inset-0 pointer-events-none z-0 transition-opacity duration-700 ${
        isCinematic ? 'opacity-90' : 'opacity-60'
      }`}
    />
  );
}

function ForensicsPage({ result }) {
  const [showOverlay, setShowOverlay] = useState(true);

  const signals = result.tampering.detectedSignals;

  return (
    <div className="space-y-6 max-w-6xl mx-auto">
      <div className="bg-white border border-slate-200 p-5 rounded-xl flex justify-between items-center">
        <div>
          <h2 className="text-lg font-bold text-slate-900">DOCUMENT FORENSICS</h2>
          <p className="text-xs text-slate-500">Deep-dive physical laminate & text font anomaly investigation.</p>
        </div>

        <button
          onClick={() => setShowOverlay(!showOverlay)}
          className="px-3 py-1 rounded text-xs font-mono bg-slate-100 text-slate-600 hover:bg-slate-100 transition"
        >
          {showOverlay ? 'Hide Overlays' : 'Show Overlays'}
        </button>
      </div>

      <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
        {/* Document Canvas */}
        <div className="md:col-span-2 bg-white border border-slate-200 p-4 rounded-xl space-y-3">
          <div className="relative w-full h-[380px] bg-slate-50 rounded-lg overflow-hidden border border-slate-200 flex items-center justify-center p-3">
            <img src={result.documentImage} alt="Forensics" className="max-h-full object-contain" />
            {showOverlay && signals.map((sig, i) => (
              <div 
                key={i}
                className="absolute border-2 border-red-600 bg-red-500/10 rounded"
                style={{
                  left: `${sig.locationBoundingBox?.x || 10}%`,
                  top: `${sig.locationBoundingBox?.y || 20}%`,
                  width: `${sig.locationBoundingBox?.width || 25}%`,
                  height: `${sig.locationBoundingBox?.height || 40}%`
                }}
              >
                <div className="absolute -top-5 left-0 bg-red-600 text-white font-mono text-[9px] px-1 rounded">
                  ⚠ {sig.title}
                </div>
              </div>
            ))}
          </div>
        </div>

        {/* Collapsible Anomaly Details (Progressive Disclosure) */}
        <div className="bg-white border border-slate-200 p-4 rounded-xl space-y-3">
          <div className="text-xs font-mono font-bold text-slate-600 uppercase">DETECTED ANOMALIES ({signals.length})</div>

          <div className="space-y-2">
            {signals.map((sig, i) => {
              const isExpanded = expandedIndex === i;
              return (
                <div key={i} className="bg-slate-50 rounded-lg border border-slate-200 overflow-hidden">
                  <button
                    onClick={() => setExpandedIndex(isExpanded ? null : i)}
                    className="w-full text-left p-3 flex justify-between items-center hover:bg-slate-50 transition text-xs font-mono"
                  >
                    <span className="font-bold text-red-600">⚠ {sig.title}</span>
                    <span className="text-[10px] text-slate-500">{isExpanded ? '▲' : '▼'}</span>
                  </button>

                  {isExpanded && (
                    <div className="p-3 border-t border-slate-200 text-[11px] font-mono text-slate-500 space-y-1.5 bg-slate-50">
                      <div><strong>Confidence:</strong> {sig.confidence}%</div>
                      <div><strong>Details:</strong> {sig.description}</div>
                      <div><strong>Location:</strong> Region {sig.locationBoundingBox?.x}% x {sig.locationBoundingBox?.y}%</div>
                    </div>
                  )}
                </div>
              );
            })}

            {signals.length === 0 && (
              <div className="text-xs font-mono text-emerald-700 bg-emerald-50/30 p-3 rounded border border-emerald-200/50 text-center">
                ✓ No anomaly signals detected.
              </div>
            )}
          </div>
        </div>
      </div>
    </div>
  );
}
